[project]
name = "omni-finetune-core"
version = "0.1.0"
description = "In-house, type-safe core for fine-tuning Meta's Omnilingual ASR (Omni CTC) models with fairseq2."
requires-python = ">=3.12,<3.13"
dependencies = [
  # Meta's model/dataset/recipe-framework code — used as deps, not vendored.
  "fairseq2[arrow]==0.8.1",
  "omnilingual-asr==0.2.0+peacock.1",
  "huggingface-hub==0.36.2",
  "torchaudio==2.9.1",
  # Data / audio / metrics.
  "numpy==2.4.6",
  "pyarrow==24.0.0",
  "soundfile==0.13.1",
  "librosa==0.11.0",
  # jiwer's process_words/process_characters API is stable across 3.x and 4.x; pinned with a
  # floor (not ==4.0.0) so consumer projects whose other deps cap jiwer can still resolve
  # (e.g. tajik-asr's nemo-toolkit requires jiwer<4.0.0). Core only uses process_words /
  # process_characters, both present since jiwer 3.x.
  "jiwer>=3.1.0,<5",
  # Typed config models + YAML emission for the recipe.
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "tqdm==4.67.3",
]

[project.scripts]
# Generic batch-budget tuning sweep — run from any consuming project's venv (its
# fairseq2 asset cards load automatically); point --cache-root at that project's tree.
omni-tune = "omni_finetune_core.tune:main"
# Bench raw omniASR-LLM variants on a project's test split (the LLM-ceiling probe).
omni-bench-llm = "omni_finetune_core.bench_llm:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff==0.15.15",
  "ty==0.0.40",
]

[tool.uv.sources]
omnilingual-asr = { path = "../../../omnilingual-asr", editable = true }

[tool.uv]
# Peacock uses a local omnilingual-asr fork with fairseq2 0.8.1 metadata. Keep this stack
# on CPython 3.12 until fairseq2n publishes cp313 wheels or we own that native build.
override-dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_finetune_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# The recipe/ subpackage is Meta's BSD-licensed glue, owned in-house but not restyled.
extend-exclude = ["src/omni_finetune_core/recipe"]

[tool.ruff.lint]
# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules. Keep this list short and justified.
select = ["ALL"]
ignore = [
  "D",        # mandatory docstrings everywhere — too heavy for a library this size
  "COM812",   # trailing-comma rule conflicts with the formatter
  "ISC001",   # implicit-str-concat rule conflicts with the formatter
  "ANN401",   # allow typing.Any at genuine dynamic boundaries (fairseq2 configs)
  "N806", "N803", "N812",  # ML naming: X, N, lr, etc.
  "PLR0913",  # configs legitimately take many fields
  "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
  "EM101", "EM102", "TRY003",  # allow inline exception messages
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so their import types must stay importable
# (not hidden in a TYPE_CHECKING block).
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "PLR2004"]  # asserts + magic values are fine in tests
# The per-language project CLI: prints are its output; torch/omnilingual_asr/presets import
# lazily so `--help` and config-building stay instant.
"src/omni_finetune_core/project.py" = ["T201", "PLC0415"]
"src/omni_finetune_core/bench_llm.py" = ["T201", "PLC0415"]  # benchmark CLI: prints; lazy heavy imports
"tests/**" = ["S101", "PLR2004", "ANN", "ARG001", "INP001", "N812", "RUF001", "RUF003"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["src/omni_finetune_core/recipe"]
