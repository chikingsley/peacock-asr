[project]
name = "omni-curator"
version = "0.1.0"
description = "In-house ASR dataset curator: raw audio -> segment -> Scribe ensemble -> consensus -> stitch -> polish -> transcript."
requires-python = ">=3.12,<3.14"
dependencies = [
  # ASR (Scribe) + the text endpoint (consensus / stitch / polish) via the deployed
  # superwhisper HTTP service — talked to over httpx from omni_curator.swservice.
  # Audio cutting/probing and the NeMo frame-VAD segmenter.
  "soundfile==0.13.1",
  "numpy==2.4.6",
  # store -> omni-parquet export (export.py): the format omni-finetune-core trains on.
  "pyarrow>=18",
  # resample on export when a stored clip isn't already 16 kHz.
  "librosa>=0.10",
  "torchaudio==2.9.1",
  "nemo-toolkit[asr]>=2.7.3",
  # Standardized WER/CER (benchmark). <4 keeps jiwer.compute_measures for nemo compatibility.
  "jiwer>=3.1.0,<5",
  # Progress bars for the long ingest/process loops.
  "tqdm>=4.66",
]

[project.scripts]
# Build a KenLM word n-gram from a dataset export's train labels (for beam-decode LM fusion).
omni-build-lm = "omni_curator.build_lm:main"

[project.optional-dependencies]
# datasets powers ingest/huggingface.py (FLEURS); audio is read as raw bytes, decoded by soundfile.
ingest = ["datasets>=3.0.0"]
# yt-dlp for create/sources/youtube.py (also needs deno + ffmpeg on PATH).
youtube = ["yt-dlp"]
# Per-language text normalization (process/normalize.py). Each lib is imported lazily inside its
# language handler, so installing this extra is only needed for the languages you actually run.
#   tajiknlp    — Tajik (tgk_Cyrl) Cyrillic normalizer + cleaner (mirrors the tajik-asr project)
#   hazm        — Persian (fas_Arab) orthographic normalization
#   num2words   — Persian number words (lang="fa")
#   num2geotext — Georgian (kat_Geor) integer/float -> Georgian words (v0.0.1; wrapped defensively)
#   anbani      — Georgian script utilities (Mtavruli capital -> Mkhedruli folding)
normalize = [
  "tajiknlp>=1.2",
  "hazm>=0.12",
  "num2words>=0.5.14",
  "num2geotext>=0.0.1",
  "anbani>=0.9.5",
]

[dependency-groups]
dev = [
  "ai-slop-detector>=3.8.6",
  "aislop>=0.12.1",
  "dslop>=0.2.2",
  "pytest>=8",
  "ruff==0.15.15",
  "ty==0.0.40",
  "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_curator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ty.environment]
python = ".venv"

[tool.ruff.lint]
# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules.
select = ["ALL"]
ignore = [
  "D",        # mandatory docstrings everywhere — too heavy for a library this size
  "COM812",   # trailing-comma rule conflicts with the formatter
  "ISC001",   # implicit-str-concat rule conflicts with the formatter
  "ANN401",   # allow typing.Any at genuine dynamic boundaries (Scribe/NeMo payloads)
  "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
  "EM101", "EM102", "TRY003",  # allow inline exception messages
  "PLR0913",  # pipeline entry points legitimately take many knobs
  "PLC0415",  # heavy/optional deps (nemo, torch, superwhisper) are imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts + magic values are the medium; fixture params and pytest idioms don't need
# annotations; no __init__.py by design (pytest rootdir discovery).
"tests/**" = ["S101", "PLR2004", "ANN", "ARG001", "INP001", "N812", "RUF001", "RUF002", "RUF003"]
"**/test_*.py" = ["S101", "PLR2004"]  # asserts + magic values are fine in tests
"src/omni_curator/project.py" = ["T201"]  # the per-language project CLI prints
# The factory CLI echoes its launch/exit log to stdout as well as to factory.log.
"src/omni_curator/factory/__main__.py" = ["T201"]
# KenLM build CLI: prints progress; runs local lmplz/build_binary from packages/kenlm/build.
"src/omni_curator/build_lm.py" = ["T201", "S603"]
# The Scribe budget balancer: a small cross-project CLI that prints + shells out to `ps`.
"src/omni_curator/scribe/balance.py" = ["T201", "S603", "S607"]
# The language gate is inherently bilingual Cyrillic vocabulary: "ambiguous character" lints
# (а vs a, etc.) are exactly wrong here, and a space-joined word string beats a 90-item list.
"src/omni_curator/process/language.py" = ["RUF001", "RUF003", "SIM905"]
# Persian/Arabic letter tables (fold variants, discard punctuation) are intentional non-Latin
# literals; "ambiguous character" lints (ا vs l, × vs x) are exactly wrong on this content.
"src/omni_curator/process/normalize.py" = ["RUF001", "RUF002", "RUF003"]
