[project]
name = "asr-benchmark-core"
version = "0.1.0"
description = "Resumable, model-neutral ASR inference into a canonical SQLite store."
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.15.0",
  "numpy>=2.4.6",
  "pyarrow>=26.0.1",
  "soundfile>=0.14.0",
  "torch>=2.9.1",
  "torchaudio>=2.9.1",
  "transformers>=5.22.1",
]

[project.scripts]
asr-benchmark = "asr_benchmark_core.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_benchmark_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY", # This repository has no declared copyright owner.
  "D",
  "COM812",
  "ISC001",
  "EM101", "EM102", "TRY003",
  "T201",
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001", "ANN"]
