name: peacock-hatchet

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HATCHET_POSTGRES_DB:-hatchet}
      POSTGRES_USER: ${HATCHET_POSTGRES_USER:-hatchet}
      POSTGRES_PASSWORD: ${HATCHET_POSTGRES_PASSWORD:-hatchet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${HATCHET_POSTGRES_USER:-hatchet} -d ${HATCHET_POSTGRES_DB:-hatchet}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HATCHET_GRPC_PORT:-7077}:7077"
      - "${HATCHET_DASHBOARD_PORT:-8898}:8888"
    environment:
      DATABASE_URL: postgresql://${HATCHET_POSTGRES_USER:-hatchet}:${HATCHET_POSTGRES_PASSWORD:-hatchet}@postgres:5432/${HATCHET_POSTGRES_DB:-hatchet}?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_COOKIE_DOMAIN:-hatchet.peacockery.studio}
      SERVER_AUTH_COOKIE_INSECURE: ${HATCHET_COOKIE_INSECURE:-f}
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: t
      SERVER_GRPC_BROADCAST_ADDRESS: ${HATCHET_GRPC_BROADCAST_ADDRESS:-localhost:7077}
      SERVER_GRPC_PORT: 7077
      SERVER_URL: ${HATCHET_PUBLIC_URL:-https://hatchet.peacockery.studio}
      SERVER_AUTH_SET_EMAIL_VERIFIED: t
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: ${HATCHET_INTERNAL_GRPC_BROADCAST_ADDRESS:-localhost:7077}
      LITE_STATIC_ASSET_DIR: /static-assets
      LITE_FRONTEND_PORT: 8081
      LITE_RUNTIME_PORT: 8888
    volumes:
      - hatchet_config:/config

volumes:
  postgres_data:
    name: peacock-hatchet_postgres_data
  hatchet_config:
    name: peacock-hatchet_hatchet_config
