[project]
name = "capt"
version = "0.1.0"
description = "Computer-assisted pronunciation training: no-training, multilingual pronunciation scoring (text -> G2P -> canonical IPA vs ZIPA phone recognizer, panphon PFER)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    # ZIPA's training targets were generated with Epitran (+ CharsiuG2P) then PHOIBLE-normalized,
    # so Epitran is the convention-matched G2P for scoring against ZIPA. Primary target backend.
    "epitran>=1.35.3",
    "huggingface-hub>=2.4.0",
    "librosa>=1.0.0",
    # ZIPA front-end: 80-bin Kaldi fbank (capt.recognize runs ZIPA in-process, not via subprocess).
    "lhotse>=1.33.0",
    "nemo-text-processing>=1.2.0",
    "numpy>=2.5.4",
    "onnxruntime-gpu>=1.31.1; platform_system == 'Linux'",
    "onnxruntime>=1.31.1; platform_system != 'Linux'",
    "panphon>=0.22.2",
    "phonemizer>=3.6.0",
    # Trained-G2P (`trained` backend) for the no-G2P gap languages; ships OpenFST/OpenGrm binaries.
    "phonetisaurus>=0.3.0",
    "soundfile>=0.14.0",
    # ElevenLabs Scribe v2 realtime ASR lane via the Cloudflare relay (asr.ScribeAsrTranscriber).
    "websockets>=17.4",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "transformers>=5.22.1",
]

[project.scripts]
capt-eval = "capt.cli.eval:main"
capt-manifest = "capt.cli.manifest:main"
capt-g2p-ablation = "capt.cli.ablation:main"
capt-fetch-zipa = "capt.cli.fetch:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capt"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["artifacts", "experiments"]

# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules. Matches omni-curator / omni-finetune-core / georgian-asr.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY", # This repository has no declared copyright owner.
    "D",        # mandatory docstrings everywhere — too heavy
    "COM812",   # trailing-comma rule conflicts with the formatter
    "ISC001",   # implicit-str-concat rule conflicts with the formatter
    "ANN401",   # allow typing.Any at genuine dynamic boundaries
    "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
    "EM101", "EM102", "TRY003",  # allow inline exception messages
    "PLR0913",  # entry points legitimately take many knobs
    "PLC0415",  # heavy/optional deps imported lazily on purpose
    "T201",     # CLI / scripts / report tooling: stdout is the interface
]

[tool.ruff.lint.per-file-ignores]
# asserts + magic values are fine in tests; ARG001/ARG002/ARG005 because test doubles
# mirror real signatures (unused params are intentional); SLF001 because tests verify internal state.
"tests/**/*.py" = ["S101", "PLR2004", "ARG001", "ARG002", "ARG005", "SLF001"]
# Cyrillic letters resembling Latin are intentional Russian normalization data.
# S603/S607: subprocess calls invoke known, trusted binaries (espeak-ng) with fixed argument
# vectors; the only variable inputs are file paths and word lists.
"src/capt/g2p/routing.py" = ["RUF001", "S603", "S607"]
"src/capt/score/phones.py" = ["RUF001"]
"src/capt/g2p/text_normalization.py" = ["RUF001"]
"tests/test_normalization.py" = ["RUF001", "S101", "PLR2004"]
"tests/test_text_normalization.py" = ["RUF001", "S101", "PLR2004"]
"tests/test_text_normalization_integration.py" = ["RUF001", "S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: exercises real package integrations such as NeMo text processing",
]
