[project]
name = "p016-russian-phone-compare"
version = "0.1.0"
description = "No-training comparison harness for ASR+G2P canonical phones against ZIPA and XLSR-eSpeak phone recognizers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.0",
    "datasets<4",
    "gradio>=5.0",
    "huggingface-hub>=0.34",
    "librosa>=0.11",
    "nemo-text-processing>=1.1.0",
    "numpy>=2.0",
    "onnxruntime-gpu>=1.18; platform_system == 'Linux'",
    "onnxruntime>=1.18; platform_system != 'Linux'",
    "panphon>=0.22",
    "phonemizer>=3.3",
    "qwen-asr>=0.0.6",
    "soundfile>=0.13",
    "torch>=2.8",
    "torchaudio>=2.8",
    "transformers>=4.55",
]

[project.optional-dependencies]
zipa = [
    "lhotse>=1.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[project.scripts]
p016-app = "p016_compare.app:main"
p016-compare = "p016_compare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p016_compare"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["artifacts", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: exercises real package integrations such as NeMo text processing",
]
