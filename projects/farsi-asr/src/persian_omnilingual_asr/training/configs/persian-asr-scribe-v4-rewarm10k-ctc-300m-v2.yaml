# scribe-v4 moderate RE-WARM: warm-restart from step_34000's weights (loaded via the
# model card) with a FRESH optimizer + fresh tri_stage schedule over 10k steps, peaking
# at 2e-6 (20% of the original 1e-5). The plain resume pinned LR at the decayed 5e-7
# floor, which only polishes; this gives the model a real second wind to test whether
# there is more to squeeze past 11.27% dev-WER. Fresh run dir (not a resume):
#   --output-dir src/finetune_omni/runs/scribe-v4-rewarm10k
model:
  # Full step_34000 weights (this card points at scribe-v4/ws_1.760d57f2 step_34000).
  name: "omni_ctc_300m_v2_scribe_v4_20260530_best"

dataset:
  name: "scribe_v4"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "/home/simon/github/peacock-asr/projects/persian-asr/src/finetune_omni/data/training/omnilingual/scribe-v4/language_distribution_0.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: true
  asr_task_config:
     min_audio_len: 16_000
     max_audio_len: 960_000
     max_num_elements: 3_840_000
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 1

tokenizer:
  name: "omniASR_tokenizer_written_v2"

optimizer:
  config:
    lr: 2e-06

# Explicit (not relying on the recipe default): warmup 10% -> hold 40% -> decay 50%,
# peak = optimizer.lr (2e-6), final = 2e-6 * 0.05 = 1e-7.
lr_scheduler:
  name: "tri_stage"
  config:
    stage_ratio: [0.1, 0.4, 0.5]
    start_lr_scale: 0.01
    final_lr_scale: 0.05

trainer:
  freeze_encoder_for_n_steps: 0
  mixed_precision:
    dtype: "torch.bfloat16"
  grad_accumulation:
    num_batches: 2
  activation_checkpointing:
    mode: "layerwise"
    every_nth_layer: 1
  gc_every_n_steps: 100

regime:
  # Fresh 10k-step run (counts from 0). Validate often and keep best-WER checkpoints so
  # the optimum in the re-warm window is preserved; ship the best, not the last.
  num_steps: 10_000
  score_metric: "wer"
  validate_every_n_steps: 500
  validate_after_n_steps: 499
  checkpoint_every_n_steps: 500
  checkpoint_after_n_steps: 499
  keep_best_n_checkpoints: 3
  keep_last_n_checkpoints: 1
  save_model_only: "all_but_last"
  publish_metrics_every_n_steps: 1
  publish_metrics_after_n_steps: 0
