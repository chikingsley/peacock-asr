model:
  name: "omniASR_CTC_300M_v2"

tokenizer:
  name: "omniASR_tokenizer_written_v2"

dataset:
  name: "fleurs_fa_ir"
  valid_split: "test"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "/home/simon/github/peacock-asr/projects/persian-asr/data/raw/fleurs_fa_ir_omni/language_distribution_0.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: true
  asr_task_config:
     min_audio_len: 16_000
     max_audio_len: 960_000
     max_num_elements: 960_000
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 1
