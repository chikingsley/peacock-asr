# 1B Omni CTC fine-tune on scribe-v4, sized for a 12 GB GPU (RTX 5070).
#
# The 1B model only fits in PURE bf16: mixed_precision.mode="off" + model.dtype=bfloat16
# means there is NO fp32 master copy, so weights + AdamW states stay in bf16 (~8 GB) rather
# than the ~16 GB the safe fp32-optimizer path would need. Empirically peaks ~9.1 GiB / 80%
# at max_num_elements=960000. TRADE-OFF: pure-bf16 AdamW is numerically riskier than the
# fp32-optimizer default — hence max_grad_norm=1.0 (gradient clipping) and grad_accumulation
# num_batches=4 to recover effective batch size lost to the small per-step element budget.
# Watch the first ~1-2k steps for loss spikes / NaNs; lower lr if it destabilizes.
#
# Starts from the UPSTREAM base (omniASR_CTC_1B_v2, auto-downloaded) — there is no Persian
# 1B checkpoint to continue from, so this is a fresh fine-tune like the original 300M runs.
model:
  name: "omniASR_CTC_1B_v2"
  dtype: "bfloat16"

dataset:
  name: "scribe_v4"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "/home/simon/github/peacock-asr/projects/persian-asr/src/finetune_omni/data/training/omnilingual/scribe-v4/language_distribution_0.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: true
  asr_task_config:
     min_audio_len: 16_000
     # Cap clips at 30s (was 60s) to bound worst-case activation memory: at the full 60s
     # max, a single-clip micro-batch peaks ~9.1 GiB / 80% — too little headroom for a long
     # run (unlucky long-sequence batches OOM). 30s halves peak per-sequence activation;
     # clips >30s are rare and the omni inference pipeline caps at 40s anyway.
     max_audio_len: 480_000
     # Budget = 2x max_audio_len -> up to two 30s clips (or more shorter ones) per micro-batch.
     max_num_elements: 960_000
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 1

tokenizer:
  name: "omniASR_tokenizer_written_v2"

optimizer:
  config:
    lr: 1e-05

trainer:
  freeze_encoder_for_n_steps: 0
  mixed_precision:
    mode: "off"
    dtype: "torch.bfloat16"
  grad_accumulation:
    num_batches: 4
  activation_checkpointing:
    mode: "layerwise"
    every_nth_layer: 1
  max_grad_norm: 1.0
  gc_every_n_steps: 100

regime:
  num_steps: 34_000
  score_metric: "wer"
  validate_every_n_steps: 1_000
  validate_after_n_steps: 999
  checkpoint_every_n_steps: 1_000
  checkpoint_after_n_steps: 999
  keep_best_n_checkpoints: 3
  keep_last_n_checkpoints: 1
  save_model_only: "all_but_last"
  publish_metrics_every_n_steps: 1
  publish_metrics_after_n_steps: 0
