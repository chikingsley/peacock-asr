[project]
name = "farsi-asr"
version = "0.1.0"
description = "Farsi (Iranian Persian) ASR dataset curation, Omnilingual fine-tuning, benchmarking, and Parakeet experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asr-benchmark-core",
  "datasets[audio]==4.8.5",
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
  "jiwer==3.1.0",
  "librosa==0.11.0",
  "nemo-toolkit[asr]>=2.7.3",
  # pyctcdecode (KenLM beam decoding in farsi-omni-eval-lm) pins numpy<2 — a dormant repo whose
  # pin predates numpy 2; force 2.x because fairseq2n needs it (matches tajik/georgian).
  "numpy==2.4.6",
  "pyctcdecode>=0.5.0",
  "omni-curator[ingest,normalize,vad-cobra,vad-silero,youtube]",
  "omni-finetune-core",
  "parakeet-finetune-core",
  "omnilingual-asr==0.2.0+peacock.1",
  "onnxruntime==1.26.0",
  "pyarrow==24.0.0",
  "rapidfuzz==3.14.5",
  "ruff==0.15.15",
  "sherpa-onnx==1.13.2",
  "sherpa-onnx-bin==1.13.2",
  "sherpa-onnx-core==1.13.2",
  "soundfile==0.13.1",
  "tensorboard==2.20.0",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "tqdm==4.67.3",
  "ty==0.0.40",
]

[tool.uv.sources]
asr-benchmark-core = { path = "../../packages/asr-benchmark-core", editable = true }
omni-curator = { path = "../../packages/omni-curator", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }
omnilingual-asr = { path = "../../../omnilingual-asr", editable = true }
parakeet-finetune-core = { path = "../../packages/parakeet-finetune-core", editable = true }

[tool.uv]
# Peacock uses a local omnilingual-asr fork with fairseq2 0.8.1 metadata. Keep Omni CTC on
# CPython 3.12 until fairseq2n publishes cp313 wheels or we own that native build.
override-dependencies = [
  # pyctcdecode (KenLM beam decoding) pins numpy<2 — a dormant repo; force 2.x (fairseq2n needs it).
  "numpy==2.4.6",
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
]

[project.entry-points."fairseq2.extension"]
farsi_asr = "farsi_asr.assets:setup_fairseq2_extension"

[project.scripts]
# Per-language multi-model standard (docs/ASR_PROJECT_STANDARD.md): shared `curate` + per-family
# `<lang>-<family>-<verb>`. Logic lives in the shared packages; this project is config only.
farsi-curate = "farsi_asr.curate:main"
# omni (OmniASR CTC) family
farsi-omni-train = "farsi_asr.omni.train:main"
farsi-omni-eval = "farsi_asr.omni.eval:main"
farsi-omni-eval-lm = "farsi_asr.omni.lm_eval:main"
# Score any shared cross-model SQLite run with the canonical Persian normalizer.
farsi-benchmark-score = "farsi_asr.benchmark:main"
farsi-vad-yield = "farsi_asr.vad_yield:main"
farsi-v4-quality = "farsi_asr.quality_v4:main"
# parakeet family
farsi-parakeet-train-tokenizer = "farsi_asr.parakeet.train:train_tokenizer"
farsi-parakeet-train-ctc = "farsi_asr.parakeet.train:train_ctc"
farsi-parakeet-train-tdt = "farsi_asr.parakeet.train:train_tdt"
farsi-parakeet-train-nemo = "farsi_asr.parakeet.train:train_nemo_recipe"
farsi-parakeet-eval = "farsi_asr.parakeet.eval:evaluate"
farsi-parakeet-build-ngram-lm = "farsi_asr.parakeet.train:build_ngram_lm"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["vendor", "**/omni_recipe", "**/nemo_recipes"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["vendor/", "**/omni_recipe/", "**/nemo_recipes/"]

# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules. Matches omni-curator / omni-finetune-core / georgian-asr.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # mandatory docstrings everywhere — too heavy
    "COM812",   # trailing-comma rule conflicts with the formatter
    "ISC001",   # implicit-str-concat rule conflicts with the formatter
    "ANN401",   # allow typing.Any at genuine dynamic boundaries
    "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
    "EM101", "EM102", "TRY003",  # allow inline exception messages
    "PLR0913",  # pipeline/dataset entry points legitimately take many knobs
    "PLC0415",  # heavy/optional deps imported lazily on purpose
    "T201",     # CLI / dataset-prep / report tooling: stdout is the interface
]

[tool.ruff.lint.per-file-ignores]
# Arabic letters resembling Latin are intentional Persian text; long channel-list data lines.
"src/farsi_asr/sources.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"tests/**" = ["S101", "INP001"]  # asserts + no __init__ are standard pytest idioms
# Research/decode scratch (not library code): import-in-fn, complexity, long lines, zip-strict.
"experiments/**" = [
    "PLC0415", "C901", "PLR0915", "E501", "B905", "T201", "INP001", "S101",
    "ANN001", "ANN202", "PTH207",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farsi_asr"]
