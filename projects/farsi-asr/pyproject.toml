[project]
name = "farsi-asr"
version = "0.1.0"
description = "Farsi (Iranian Persian) ASR dataset curation, Omnilingual fine-tuning, benchmarking, and Parakeet experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets[audio]==4.8.5",
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
  "jiwer==3.1.0",
  "librosa==0.11.0",
  "nemo-curator==1.1.0",
  "nemo-toolkit[asr]>=2.7.3",
  "numpy==2.4.6",
  "omni-curator[ingest,youtube,normalize]",
  "omni-finetune-core",
  "parakeet-finetune-core",
  "omnilingual-asr==0.2.0",
  "onnxruntime==1.26.0",
  "pyarrow==24.0.0",
  "rapidfuzz==3.14.5",
  "ruff==0.15.15",
  "sherpa-onnx==1.13.2",
  "sherpa-onnx-bin==1.13.2",
  "sherpa-onnx-core==1.13.2",
  "soundfile==0.13.1",
  "superwhisper-api",
  "tensorboard==2.20.0",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "tqdm==4.67.3",
  "ty==0.0.40",
]

[tool.uv.sources]
superwhisper-api = { path = "../../packages/superwhisper-api", editable = true }
omni-curator = { path = "../../packages/omni-curator", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }
parakeet-finetune-core = { path = "../../packages/parakeet-finetune-core", editable = true }

[tool.uv]
# omnilingual-asr 0.2.0 pins fairseq2<=0.6.0, but omni-finetune-core's recipe (and the
# Tajik project) run on fairseq2 0.8.1. Override forces 0.8.1 past that pin so the lock
# resolves; the omnilingual-asr inference pipeline still works on it. hf-hub stays <1.0
# because fairseq2 0.8.1 requires ~=0.32. NOTE: this bumps the env off the version the
# legacy finetune_omni vendored recipe targeted — use persian-omni-train for new runs.
override-dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
]

[project.entry-points."fairseq2.extension"]
farsi_asr = "farsi_omnilingual_asr.fairseq2_assets:setup_fairseq2_extension"
# The template package registers ONLY new card names (it imports the legacy cards instead of
# redefining them — duplicate names across fairseq2 metadata providers are a hard error).
farsi_asr_v2 = "farsi_asr.assets:setup_fairseq2_extension"

[project.scripts]
# The template-shaped package (farsi_asr): the thin per-language standard. The -v2 train/eval
# names keep the legacy CLIs below untouched.
farsi-curate = "farsi_asr.curate:main"
farsi-train-v2 = "farsi_asr.train:main"
farsi-eval-v2 = "farsi_asr.eval:main"
# Omni fine-tune / eval on the shared omni-finetune-core recipe (farsi_omnilingual_asr).
farsi-omni-train = "farsi_omnilingual_asr.training.train:main"
farsi-omni-eval = "farsi_omnilingual_asr.eval.test_split:main"
farsi-omni-audit-tokenizer = "farsi_omnilingual_asr.training.tokenizer_audit:main"
farsi-benchmark-asr = "finetune_omni.benchmarks.asr:main"
farsi-benchmark-compare = "finetune_omni.benchmarks.compare:main"
farsi-benchmark-omni = "finetune_omni.benchmarks.omni:main"
farsi-benchmark-sherpa-onnx = "finetune_omni.benchmarks.sherpa_onnx:main"
farsi-benchmark-suite = "finetune_omni.benchmarks.suite:main"
farsi-build-canonical-datasets = "farsi_asr_dataset.cli.build_canonical:main"
farsi-build-candidate-manifests = "farsi_asr_dataset.curation.build_candidate_manifests:main"
farsi-export-nemo-manifest = "farsi_asr_dataset.cli.export_nemo_manifest:main"
farsi-dataset-export-canonical-nemo-manifest = "farsi_asr_dataset.cli.export_canonical_nemo_manifest:main"
farsi-dataset-filter-nemo-manifest = "farsi_asr_dataset.cli.filter_nemo_manifest:main"
farsi-ingest = "farsi_asr_dataset.cli.ingest:main"
farsi-dataset-run-nemo-curator = "farsi_asr_dataset.cli.run_nemo_curator:main"
farsi-scribe-build-curation-db = "farsi_asr_dataset.cli.build_scribe_curation_db:main"
farsi-scribe-curation = "farsi_asr_dataset.cli.scribe_curation:main"
farsi-scribe-rerun-sqlite = "farsi_asr_dataset.cli.scribe_rerun_sqlite:main"
farsi-scribe-script-equivalence = "farsi_asr_dataset.cli.scribe_script_equivalence:main"
farsi-parakeet-eval = "farsi_asr.parakeet:evaluate"
farsi-finetune-parakeet-ctc = "finetune_parakeet.cli.finetune_parakeet_ctc:main"
farsi-finetune-parakeet = "finetune_parakeet.cli.finetune_parakeet:main"
farsi-prepare-omni-curated = "farsi_asr_dataset.dataset_prep.curated:main"
farsi-prepare-omni-fleurs = "farsi_asr_dataset.dataset_prep.fleurs:main"
farsi-prepare-omni-thomcles = "farsi_asr_dataset.dataset_prep.thomcles:main"
farsi-omni-text-audit = "farsi_asr_dataset.dataset_prep.text_audit:main"
farsi-repair-neyshekar = "farsi_asr_dataset.dataset_prep.neyshekar:main"
farsi-run-nemo-curator = "farsi_asr_dataset.curation.run_nemo_curator:main"
farsi-score-omni-manifest = "farsi_asr_dataset.curation.score_omni_manifest:main"
farsi-train-omni = "finetune_omni.training.train:main"
farsi-train-tokenizer = "finetune_parakeet.cli.train_tokenizer:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["vendor", "**/omni_recipe", "**/nemo_recipes"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["vendor/", "**/omni_recipe/", "**/nemo_recipes/"]

# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules. Matches omni-curator / omni-finetune-core / georgian-asr.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # mandatory docstrings everywhere — too heavy
    "COM812",   # trailing-comma rule conflicts with the formatter
    "ISC001",   # implicit-str-concat rule conflicts with the formatter
    "ANN401",   # allow typing.Any at genuine dynamic boundaries
    "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
    "EM101", "EM102", "TRY003",  # allow inline exception messages
    "PLR0913",  # pipeline/dataset entry points legitimately take many knobs
    "PLC0415",  # heavy/optional deps imported lazily on purpose
    "T201",     # CLI / dataset-prep / report tooling: stdout is the interface
]

[tool.ruff.lint.per-file-ignores]
"src/farsi_asr_dataset/curation/run_nemo_curator.py" = [
    "E402",     # Ray uv-runtime control must be set before importing Curator/Ray.
    "PLC0415",  # Curator/Xenna imports must happen after local Ray setup.
]
"src/farsi_asr_dataset/cli/run_nemo_curator.py" = [
    "E402",     # Ray uv-runtime control must be set before importing Curator/Ray.
    "PLC0415",  # Curator/Xenna imports must happen after local Ray setup.
]
"src/farsi_asr_dataset/canonical.py" = [
    "PLR0913",  # Dataset writers and source adapters carry explicit schema fields.
]
"src/farsi_asr_dataset/curation/score_omni_manifest.py" = [
    "PLC0415",  # FAIRSEQ2_ASSET_DIR must be set before importing the Omni pipeline.
]
"src/finetune_omni/benchmarks/asr.py" = [
    "PLC0415",  # FAIRSEQ2_ASSET_DIR must be set before importing the Omni pipeline.
]
"src/farsi_asr_dataset/cli/scribe_curation.py" = [
    "S608",  # dynamic SQL builds from trusted internal schema identifiers (SURFACES dict, view defs, SQL-escaped task/model), not user input.
]
"src/farsi_asr_dataset/cli/scribe_rerun_sqlite.py" = [
    "S608",  # dynamic SQL builds from int-coerced limits and an operator-supplied --where clause (trusted internal CLI), not end-user input.
]
"src/farsi_asr_dataset/cli/export_nemo_manifest.py" = [
    "S608",  # dynamic SQL builds from trusted internal clause constants + a parameterized temp-table join, not user input.
]
"src/farsi_asr_dataset/cli/scribe_script_equivalence.py" = [
    "S608",  # dynamic SQL builds from an int-coerced limit + an operator-supplied --where clause (trusted internal CLI), not end-user input.
]
"src/farsi_asr_dataset/dataset_prep/thomcles.py" = [
    "C901",  # main() is a one-off linear ingest script (download -> filter -> convert -> stratify); flat by nature.
]
"src/farsi_asr_dataset/text_normalization.py" = [
    "RUF001",  # Arabic letters resembling Latin are intentional normalization data.
    "RUF002",  # ditto in docstrings.
    "RUF003",  # ditto in comments.
    "RUF005",  # explicit list concatenation mirrors the upstream NVIDIA script.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/farsi_asr",
  "src/farsi_asr_dataset",
  "src/farsi_omnilingual_asr",
  "src/finetune_omni",
  "src/finetune_parakeet",
]
