[project]
name = "russian-asr"
version = "0.1.0"
description = "Russian ASR: create-path data (YouTube + Pimsleur) + omni 300M fine-tune, separate from Iranian Farsi."
requires-python = ">=3.12,<3.13"
dependencies = [
  "omni-curator[ingest,youtube,normalize]",
  "omni-finetune-core",
]

[dependency-groups]
dev = [
  "kenlm>=0.3.0",
  "pyctcdecode>=0.5.0",
  "ruff==0.15.15",
  "ty==0.0.40",
]

[tool.uv.sources]
omni-curator = { path = "../../packages/omni-curator", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }

[tool.uv]
# omnilingual-asr 0.2.0 pins fairseq2<=0.6.0, but the recipe runs on 0.8.1; hf-hub held <1.0
# (fairseq2 0.8.1 needs ~=0.32). pyctcdecode pins numpy<2 (dormant); fairseq2n needs 2.x.
override-dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
  "numpy==2.4.6",
]

[project.scripts]
russian-curate = "russian_asr.curate:main"
russian-train = "russian_asr.train:main"
russian-eval = "russian_asr.eval:main"

[project.entry-points."fairseq2.extension"]
russian_asr = "russian_asr.assets:setup_fairseq2_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/russian_asr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ty.environment]
python = ".venv"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D", "COM812", "ISC001", "ANN401", "PLR0913", "PLC0415",
  "TD002", "TD003", "FIX002", "EM101", "EM102", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/russian_asr/curate.py" = ["T201"]
"src/russian_asr/train.py" = ["T201"]
"src/russian_asr/eval.py" = ["T201"]
