[project]
name = "p012-hmamba-faithful"
version = "0.1.0"
description = "Paper-faithful HMamba implementation with audited fixes"
requires-python = ">=3.11"
dependencies = [
    "torch==2.11.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "jiwer>=3.0",
    "PyYAML>=6.0",
    "einops>=0.8",
    "pydantic==2.12.5",
    "mamba-ssm==2.3.1",
    "causal-conv1d==1.6.1",
]

[project.scripts]
p012-train = "p012.trainer:main"
p012-recog = "p012.recog:main"
p012-benchmark-compile = "p012.benchmark_compile:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p012"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "RUF"]
ignore = [
    "N812",
]

[tool.ty.environment]
python-version = "3.11"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
allowed-unresolved-imports = ["wandb"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff==0.15.8",
    "ty==0.0.26",
]
train = [
    "wandb>=0.18",
]
