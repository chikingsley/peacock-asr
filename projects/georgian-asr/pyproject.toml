[project]
name = "georgian-asr"
version = "0.1.0"
description = "Georgian ASR: a fresh-language reference project driving omni-curator + omni-finetune-core end to end."
requires-python = ">=3.12,<3.13"
dependencies = [
  "omni-curator[ingest,youtube,normalize]",
  "omni-finetune-core",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
  "kenlm>=0.3.0",
  "pyctcdecode>=0.5.0",
  "ruff==0.15.15",
  "ty==0.0.40",
]

[tool.uv.sources]
omni-curator = { path = "../../packages/omni-curator", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }

[tool.uv]
# omnilingual-asr 0.2.0 pins fairseq2<=0.6.0, but the recipe runs on 0.8.1; hf-hub held <1.0
# (fairseq2 0.8.1 needs ~=0.32). Same overrides as the other projects/packages.
override-dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
  # pyctcdecode pins numpy<2 (dormant repo, pin predates numpy 2); fairseq2n needs 2.x.
  "numpy==2.4.6",
]

[project.scripts]
# Per-language multi-model standard (docs/ASR_PROJECT_STANDARD.md): shared curate + per-family verbs.
georgian-curate = "georgian_asr.curate:main"
# omni (OmniASR CTC) family
georgian-omni-train = "georgian_asr.omni.train:main"
georgian-omni-eval = "georgian_asr.omni.eval:main"
# deprecated bare aliases (= omni) — kept for one transition, retire later
georgian-train = "georgian_asr.omni.train:main"
georgian-eval = "georgian_asr.omni.eval:main"

[project.entry-points."fairseq2.extension"]
georgian_asr = "georgian_asr.assets:setup_fairseq2_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/georgian_asr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ty.environment]
python = ".venv"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D", "COM812", "ISC001", "ANN401", "PLR0913", "PLC0415",
  "TD002", "TD003", "FIX002", "EM101", "EM102", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/georgian_asr/curate.py" = ["T201"]  # the curate CLI prints
"src/georgian_asr/omni/train.py" = ["T201"]  # the train CLI prints status
"src/georgian_asr/omni/eval.py" = ["T201"]   # the eval CLI prints the report
