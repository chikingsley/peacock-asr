[project]
name = "georgian-asr"
version = "0.1.0"
description = "Georgian ASR: a fresh-language reference project driving omni-curator + omni-finetune-core end to end."
requires-python = ">=3.12,<3.13"
dependencies = [
  "omni-curator[ingest]",
  "omni-finetune-core",
]

[dependency-groups]
dev = [
  "ruff==0.15.15",
  "ty==0.0.40",
]

[tool.uv.sources]
omni-curator = { path = "../../packages/omni-curator", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }

[tool.uv]
# omnilingual-asr 0.2.0 pins fairseq2<=0.6.0, but the recipe runs on 0.8.1; hf-hub held <1.0
# (fairseq2 0.8.1 needs ~=0.32). Same overrides as the other projects/packages.
override-dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
]

[project.scripts]
georgian-ingest = "georgian_asr.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/georgian_asr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ty.environment]
python = ".venv"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D", "COM812", "ISC001", "ANN401", "PLR0913", "PLC0415",
  "TD002", "TD003", "FIX002", "EM101", "EM102", "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/georgian_asr/ingest.py" = ["T201"]  # the ingest CLI prints
