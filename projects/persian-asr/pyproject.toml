[project]
name = "persian-asr"
version = "0.1.0"
description = "Persian ASR dataset curation, Omnilingual fine-tuning, benchmarking, and Parakeet experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets[audio]==4.8.5",
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
  "jiwer==3.1.0",
  "librosa==0.11.0",
  "nemo-curator==1.1.0",
  "nemo-toolkit[asr]>=2.7.3",
  "numpy==2.4.6",
  "omni-finetune-core",
  "omnilingual-asr==0.2.0",
  "onnxruntime==1.26.0",
  "pyarrow==24.0.0",
  "rapidfuzz==3.14.5",
  "ruff==0.15.15",
  "sherpa-onnx==1.13.2",
  "sherpa-onnx-bin==1.13.2",
  "sherpa-onnx-core==1.13.2",
  "soundfile==0.13.1",
  "superwhisper-api",
  "tensorboard==2.20.0",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "tqdm==4.67.3",
  "ty==0.0.40",
]

[tool.uv.sources]
superwhisper-api = { path = "../../packages/superwhisper-api", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }

[tool.uv]
# omnilingual-asr 0.2.0 pins fairseq2<=0.6.0, but omni-finetune-core's recipe (and the
# Tajik project) run on fairseq2 0.8.1. Override forces 0.8.1 past that pin so the lock
# resolves; the omnilingual-asr inference pipeline still works on it. hf-hub stays <1.0
# because fairseq2 0.8.1 requires ~=0.32. NOTE: this bumps the env off the version the
# legacy finetune_omni vendored recipe targeted — use persian-omni-train for new runs.
override-dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
]

[project.entry-points."fairseq2.extension"]
persian_asr = "persian_omnilingual_asr.fairseq2_assets:setup_fairseq2_extension"

[project.scripts]
# Omni fine-tune / eval on the shared omni-finetune-core recipe (persian_omnilingual_asr).
persian-omni-train = "persian_omnilingual_asr.training.train:main"
persian-omni-eval = "persian_omnilingual_asr.eval.test_split:main"
persian-omni-audit-tokenizer = "persian_omnilingual_asr.training.tokenizer_audit:main"
persian-benchmark-asr = "finetune_omni.benchmarks.asr:main"
persian-benchmark-compare = "finetune_omni.benchmarks.compare:main"
persian-benchmark-omni = "finetune_omni.benchmarks.omni:main"
persian-benchmark-sherpa-onnx = "finetune_omni.benchmarks.sherpa_onnx:main"
persian-benchmark-suite = "finetune_omni.benchmarks.suite:main"
persian-build-canonical-datasets = "persian_asr_dataset.cli.build_canonical:main"
persian-build-candidate-manifests = "persian_asr_dataset.curation.build_candidate_manifests:main"
persian-export-nemo-manifest = "persian_asr_dataset.cli.export_nemo_manifest:main"
persian-dataset-export-canonical-nemo-manifest = "persian_asr_dataset.cli.export_canonical_nemo_manifest:main"
persian-dataset-filter-nemo-manifest = "persian_asr_dataset.cli.filter_nemo_manifest:main"
persian-ingest = "persian_asr_dataset.cli.ingest:main"
persian-dataset-run-nemo-curator = "persian_asr_dataset.cli.run_nemo_curator:main"
persian-scribe-build-curation-db = "persian_asr_dataset.cli.build_scribe_curation_db:main"
persian-scribe-curation = "persian_asr_dataset.cli.scribe_curation:main"
persian-scribe-rerun-sqlite = "persian_asr_dataset.cli.scribe_rerun_sqlite:main"
persian-scribe-script-equivalence = "persian_asr_dataset.cli.scribe_script_equivalence:main"
persian-finetune-parakeet-ctc = "finetune_parakeet.cli.finetune_parakeet_ctc:main"
persian-finetune-parakeet = "finetune_parakeet.cli.finetune_parakeet:main"
persian-prepare-omni-curated = "persian_asr_dataset.dataset_prep.curated:main"
persian-prepare-omni-fleurs = "persian_asr_dataset.dataset_prep.fleurs:main"
persian-prepare-omni-thomcles = "persian_asr_dataset.dataset_prep.thomcles:main"
persian-omni-text-audit = "persian_asr_dataset.dataset_prep.text_audit:main"
persian-repair-neyshekar = "persian_asr_dataset.dataset_prep.neyshekar:main"
persian-run-nemo-curator = "persian_asr_dataset.curation.run_nemo_curator:main"
persian-score-omni-manifest = "persian_asr_dataset.curation.score_omni_manifest:main"
persian-train-omni = "finetune_omni.training.train:main"
persian-train-tokenizer = "finetune_parakeet.cli.train_tokenizer:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["vendor", "**/omni_recipe", "**/nemo_recipes"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["vendor/", "**/omni_recipe/", "**/nemo_recipes/"]

# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules. Matches omni-curator / omni-finetune-core / georgian-asr.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # mandatory docstrings everywhere — too heavy
    "COM812",   # trailing-comma rule conflicts with the formatter
    "ISC001",   # implicit-str-concat rule conflicts with the formatter
    "ANN401",   # allow typing.Any at genuine dynamic boundaries
    "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
    "EM101", "EM102", "TRY003",  # allow inline exception messages
    "PLR0913",  # pipeline/dataset entry points legitimately take many knobs
    "PLC0415",  # heavy/optional deps imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"src/persian_asr_dataset/curation/run_nemo_curator.py" = [
    "E402",     # Ray uv-runtime control must be set before importing Curator/Ray.
    "PLC0415",  # Curator/Xenna imports must happen after local Ray setup.
]
"src/persian_asr_dataset/cli/run_nemo_curator.py" = [
    "E402",     # Ray uv-runtime control must be set before importing Curator/Ray.
    "PLC0415",  # Curator/Xenna imports must happen after local Ray setup.
]
"src/persian_asr_dataset/canonical.py" = [
    "PLR0913",  # Dataset writers and source adapters carry explicit schema fields.
]
"src/persian_asr_dataset/curation/score_omni_manifest.py" = [
    "PLC0415",  # FAIRSEQ2_ASSET_DIR must be set before importing the Omni pipeline.
]
"src/finetune_omni/benchmarks/asr.py" = [
    "PLC0415",  # FAIRSEQ2_ASSET_DIR must be set before importing the Omni pipeline.
]
"src/persian_omnilingual_asr/eval/test_split.py" = [
    "T201",  # report CLI: prints WER/CER tables to stdout by design.
]
"src/persian_omnilingual_asr/training/tokenizer_audit.py" = [
    "T201",  # audit CLI: prints coverage report + unknown-token examples to stdout.
]
"src/persian_asr_dataset/text_normalization.py" = [
    "RUF001",  # Arabic letters resembling Latin are intentional normalization data.
    "RUF002",  # ditto in docstrings.
    "RUF003",  # ditto in comments.
    "RUF005",  # explicit list concatenation mirrors the upstream NVIDIA script.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/persian_asr_dataset",
  "src/persian_omnilingual_asr",
  "src/finetune_omni",
  "src/finetune_parakeet",
]
