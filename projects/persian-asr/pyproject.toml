[project]
name = "persian-asr"
version = "0.1.0"
description = "Persian ASR dataset curation, Omnilingual fine-tuning, benchmarking, and Parakeet experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets[audio]==4.8.5",
  "huggingface-hub==0.36.2",
  "jiwer==3.1.0",
  "librosa==0.11.0",
  "nemo-curator==1.1.0",
  "nemo-toolkit[asr]==2.4.1",
  "numpy==1.26.4",
  "omnilingual-asr==0.2.0",
  "onnxruntime==1.26.0",
  "pyarrow==24.0.0",
  "rapidfuzz==3.14.5",
  "ruff==0.15.13",
  "sherpa-onnx==1.13.2",
  "sherpa-onnx-bin==1.13.2",
  "sherpa-onnx-core==1.13.2",
  "soundfile==0.13.1",
  "superwhisper-api",
  "tensorboard==2.20.0",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "tqdm==4.67.3",
  "ty==0.0.35",
]

[tool.uv.sources]
superwhisper-api = { path = "../superwhisper-api", editable = true }

[project.scripts]
persian-benchmark-asr = "finetune_omni.benchmarks.asr:main"
persian-benchmark-compare = "finetune_omni.benchmarks.compare:main"
persian-benchmark-omni = "finetune_omni.benchmarks.omni:main"
persian-benchmark-sherpa-onnx = "finetune_omni.benchmarks.sherpa_onnx:main"
persian-benchmark-suite = "finetune_omni.benchmarks.suite:main"
persian-build-canonical-datasets = "persian_asr_dataset.cli.build_canonical:main"
persian-build-candidate-manifests = "finetune_omni.curation.build_candidate_manifests:main"
persian-export-nemo-manifest = "persian_asr_dataset.cli.export_nemo_manifest:main"
persian-dataset-export-canonical-nemo-manifest = "persian_asr_dataset.cli.export_canonical_nemo_manifest:main"
persian-dataset-filter-nemo-manifest = "persian_asr_dataset.cli.filter_nemo_manifest:main"
persian-ingest = "persian_asr_dataset.cli.ingest:main"
persian-dataset-run-nemo-curator = "persian_asr_dataset.cli.run_nemo_curator:main"
persian-scribe-build-curation-db = "persian_asr_dataset.cli.build_scribe_curation_db:main"
persian-scribe-curation = "persian_asr_dataset.cli.scribe_curation:main"
persian-scribe-rerun-sqlite = "persian_asr_dataset.cli.scribe_rerun_sqlite:main"
persian-scribe-script-equivalence = "persian_asr_dataset.cli.scribe_script_equivalence:main"
persian-finetune-parakeet-ctc = "finetune_parakeet.cli.finetune_parakeet_ctc:main"
persian-finetune-parakeet = "finetune_parakeet.cli.finetune_parakeet:main"
persian-prepare-omni-curated = "persian_asr_dataset.dataset_prep.curated:main"
persian-prepare-omni-fleurs = "persian_asr_dataset.dataset_prep.fleurs:main"
persian-prepare-omni-thomcles = "persian_asr_dataset.dataset_prep.thomcles:main"
persian-omni-text-audit = "persian_asr_dataset.dataset_prep.text_audit:main"
persian-repair-neyshekar = "persian_asr_dataset.dataset_prep.neyshekar:main"
persian-run-nemo-curator = "finetune_omni.curation.run_nemo_curator:main"
persian-score-omni-manifest = "finetune_omni.curation.score_omni_manifest:main"
persian-train-omni = "finetune_omni.training.train:main"
persian-train-tokenizer = "finetune_parakeet.cli.train_tokenizer:main"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["vendor", "**/omni_recipe", "**/nemo_recipes"]

[tool.ty.src]
exclude = ["vendor/", "**/omni_recipe/", "**/nemo_recipes/"]

[tool.ruff.lint]
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Require modern Python syntax for the configured target version
    "B",        # Catch likely bugs and design problems
    "N",        # Enforce PEP8 naming
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns
    "RUF",      # Ruff-specific correctness and cleanup rules
    "ARG",      # Catch unused function arguments
    "DTZ",      # Require timezone-aware datetime usage
    "PERF",     # Catch avoidable performance footguns
    "PL",       # Pylint-derived correctness checks
    "A",        # Avoid shadowing Python builtins
    "BLE",      # Avoid broad blind exception handling
]

[tool.ruff.lint.per-file-ignores]
"src/finetune_omni/curation/run_nemo_curator.py" = [
    "E402",     # Ray uv-runtime control must be set before importing Curator/Ray.
    "PLC0415",  # Curator/Xenna imports must happen after local Ray setup.
]
"src/persian_asr_dataset/cli/run_nemo_curator.py" = [
    "E402",     # Ray uv-runtime control must be set before importing Curator/Ray.
    "PLC0415",  # Curator/Xenna imports must happen after local Ray setup.
]
"src/persian_asr_dataset/canonical.py" = [
    "PLR0913",  # Dataset writers and source adapters carry explicit schema fields.
]
"src/finetune_omni/curation/score_omni_manifest.py" = [
    "PLC0415",  # FAIRSEQ2_ASSET_DIR must be set before importing the Omni pipeline.
]
"src/finetune_omni/benchmarks/asr.py" = [
    "PLC0415",  # FAIRSEQ2_ASSET_DIR must be set before importing the Omni pipeline.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/persian_asr_dataset",
  "src/finetune_omni",
  "src/finetune_parakeet",
]
