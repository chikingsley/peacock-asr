[project]
name = "p010-muffin-improvements"
version = "0.1.0"
description = "MuFFIN replication + CHConv feature extraction improvements for pronunciation assessment"
requires-python = ">=3.12"
dependencies = [
    # core ML
    "torch>=2.5",
    "torchaudio>=2.5",
    "transformers>=4.47",
    "datasets>=3.0",
    "accelerate>=1.0",
    # data / science
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    # experiment tracking — TODO: confirm traceo package name (not on PyPI yet)
    # for now using wandb directly; swap once traceo package is confirmed
    "wandb>=0.19",
    # config
    "pydantic-settings>=2.6",
    "pydantic>=2.9",
    # utils
    "rich>=13.9",
    "click>=8.1",
    "tqdm>=4.67",
    # audio
    "soundfile>=0.12",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "ty>=0.0.1a",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p010"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN101",   # missing type annotation for self
    "ANN102",   # missing type annotation for cls
    "ANN401",   # dynamically typed expressions (Any)
    "B008",     # do not perform function call in argument defaults
]
# file length is a heuristic, not a hard rule — warn but don't fail
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
python-version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
