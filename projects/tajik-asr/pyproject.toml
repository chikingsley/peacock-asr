[project]
name = "tajik-asr"
version = "0.1.0"
description = "Tajik ASR: dataset prep, Omnilingual fine-tuning, and evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
  "jiwer==3.1.0",
  "librosa==0.11.0",
  "nemo-toolkit[asr]>=2.7.3",
  "numpy==2.4.6",
  "omni-curator[youtube]",
  "omni-finetune-core",
  "parakeet-finetune-core",
  "omnilingual-asr==0.2.0",
  "pyarrow==24.0.0",
  "ruff==0.15.15",
  "soundfile==0.13.1",
  "superwhisper-api",
  "tajiknlp[neural]==1.2.0",
  "tensorboard==2.20.0",
  "torchaudio==2.9.1",
  "tqdm==4.67.3",
  "ty==0.0.40",
]

[tool.uv.sources]
superwhisper-api = { path = "../../packages/superwhisper-api", editable = true }
omni-curator = { path = "../../packages/omni-curator", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }
parakeet-finetune-core = { path = "../../packages/parakeet-finetune-core", editable = true }

[tool.uv]
# omnilingual-asr 0.2.0 (latest) pins fairseq2<=0.6.0, but we run the latest fairseq2 0.8.1
# (the recipe works on it). Override forces fairseq2 0.8.1 past that pin so the lock resolves.
# hf-hub is held <1.0 because fairseq2 0.8.1 requires ~=0.32 (1.x is impossible).
override-dependencies = [
  # pyctcdecode pins numpy<2 (dormant repo, pin predates numpy 2); fairseq2n needs 2.x.
  "numpy==2.4.6",
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
]

[project.scripts]
# Per-language multi-model standard (docs/ASR_PROJECT_STANDARD.md): shared `curate` + per-family
# `<lang>-<family>-<verb>`. Logic lives in the shared packages; this project is config only.
tajik-curate = "tajik_asr.curate:main"
# omni (OmniASR CTC) family
tajik-omni-train = "tajik_asr.omni.train:main"
tajik-omni-eval = "tajik_asr.omni.eval:main"
# deprecated bare aliases (= omni) — kept for one transition, retire later
tajik-train = "tajik_asr.omni.train:main"
tajik-eval = "tajik_asr.omni.eval:main"
# parakeet family
tajik-parakeet-train-tokenizer = "tajik_asr.parakeet.train:train_tokenizer"
tajik-parakeet-train-ctc = "tajik_asr.parakeet.train:train_ctc"
tajik-parakeet-train-tdt = "tajik_asr.parakeet.train:train_tdt"
tajik-parakeet-train-nemo = "tajik_asr.parakeet.train:train_nemo_recipe"
tajik-parakeet-eval = "tajik_asr.parakeet.eval:evaluate"

[project.entry-points."fairseq2.extension"]
tajik_asr = "tajik_asr.assets:setup_fairseq2_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyctcdecode>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tajik_asr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ty.environment]
python = ".venv"

# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules. Matches omni-curator / omni-finetune-core / georgian-asr.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # mandatory docstrings everywhere — too heavy
    "COM812",   # trailing-comma rule conflicts with the formatter
    "ISC001",   # implicit-str-concat rule conflicts with the formatter
    "ANN401",   # allow typing.Any at genuine dynamic boundaries
    "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
    "EM101", "EM102", "TRY003",  # allow inline exception messages
    "PLR0913",  # pipeline entry points legitimately take many knobs
    "PLC0415",  # heavy/optional deps imported lazily on purpose
    "B008",     # FastAPI/typer-style defaults via function call are intentional
    "N806",     # ML code uses uppercase tensor/matrix names (X, y)
    "N812",     # common ML import aliases (e.g. functional as F)
    "T201",     # CLI / dataset-prep / report tooling: stdout is the interface
]

[tool.ruff.lint.per-file-ignores]
# Cyrillic letters resembling Latin are intentional Tajik text.
"src/tajik_asr/omni/eval.py" = ["RUF002"]
"src/tajik_asr/sources.py" = ["RUF001", "RUF002", "RUF003", "E501"]  # long channel-list data lines
# Research/diagnostic scripts (gates), not library code. Relaxed by intent:
# ANN001/ANN202 (annotating dynamic fairseq2 module args/closures adds noise, not safety),
# INP001 (flat run-directly script dir, not an importable package),
# N803 (ML matrix arg names like H), S101 (asserts are deliberate sanity gates),
# PLR2004 (inline magic numbers are clearer than named consts in throwaway probes),
# PLR0915/C901 (single-shot main() entry points run long by nature).
"experiments/**" = ["ANN001", "ANN202", "INP001", "N803", "S101", "PLR2004", "PLR0915", "C901"]
