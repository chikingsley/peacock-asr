[project]
name = "tajik-asr"
version = "0.1.0"
description = "Tajik ASR: dataset prep, Omnilingual fine-tuning, and evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
  "jiwer==3.1.0",
  "librosa==0.11.0",
  "nemo-toolkit[asr]>=2.7.3",
  "numpy==2.4.6",
  "omni-curator[youtube]",
  "omni-finetune-core",
  "omnilingual-asr==0.2.0",
  "pyarrow==24.0.0",
  "ruff==0.15.15",
  "soundfile==0.13.1",
  "superwhisper-api",
  "tajiknlp[neural]==1.2.0",
  "tensorboard==2.20.0",
  "torchaudio==2.9.1",
  "tqdm==4.67.3",
  "ty==0.0.40",
]

[tool.uv.sources]
superwhisper-api = { path = "../../packages/superwhisper-api", editable = true }
omni-curator = { path = "../../packages/omni-curator", editable = true }
omni-finetune-core = { path = "../../packages/omni-finetune-core", editable = true }

[tool.uv]
# omnilingual-asr 0.2.0 (latest) pins fairseq2<=0.6.0, but we run the latest fairseq2 0.8.1
# (the recipe works on it). Override forces fairseq2 0.8.1 past that pin so the lock resolves.
# hf-hub is held <1.0 because fairseq2 0.8.1 requires ~=0.32 (1.x is impossible).
override-dependencies = [
  "fairseq2[arrow]==0.8.1",
  "huggingface-hub==0.36.2",
]

[project.scripts]
# Convention: tajik-<verb>-<object>. Day-to-day pipeline: build -> export -> audit -> train.
# (curate-scribe is an auxiliary tool.) One-time/superseded scripts live in
# dataset_prep/archive/ with no entry point — run via `python -m` if ever needed.
tajik-build-combined = "tajik_omnilingual_asr.dataset_prep.combined:main"
tajik-export-manifest = "tajik_omnilingual_asr.dataset_prep.omni_manifest:main"
tajik-export-parquet = "tajik_omnilingual_asr.dataset_prep.omni_parquet:main"
tajik-curate-scribe = "tajik_omnilingual_asr.dataset_prep.curation.scribe:main"
tajik-curate = "tajik_omnilingual_asr.curate:main"
tajik-audit-tokenizer = "tajik_omnilingual_asr.training.tokenizer_audit:main"
tajik-train = "tajik_omnilingual_asr.training.train:main"
tajik-eval-test = "tajik_omnilingual_asr.eval.test_split:main"

[project.entry-points."fairseq2.extension"]
tajik_asr = "tajik_omnilingual_asr.fairseq2_assets:setup_fairseq2_extension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tajik_omnilingual_asr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
# Archived/dead one-off dataset-prep code and vendored ParsTranslit upstream — kept for
# reference, not maintained, and nothing live imports it. Not linted at all.
extend-exclude = ["**/archive"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
exclude = ["**/archive/parstranslit/"]

# "ruff max": enable everything, then turn off only the genuinely impractical or
# formatter-conflicting rules. Matches omni-curator / omni-finetune-core / georgian-asr.
[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # mandatory docstrings everywhere — too heavy
    "COM812",   # trailing-comma rule conflicts with the formatter
    "ISC001",   # implicit-str-concat rule conflicts with the formatter
    "ANN401",   # allow typing.Any at genuine dynamic boundaries
    "TD002", "TD003", "FIX002",  # don't require issue links on TODOs
    "EM101", "EM102", "TRY003",  # allow inline exception messages
    "PLR0913",  # pipeline entry points legitimately take many knobs
    "PLC0415",  # heavy/optional deps imported lazily on purpose
    "B008",     # FastAPI/typer-style defaults via function call are intentional
    "N806",     # ML code uses uppercase tensor/matrix names (X, y)
    "N812",     # common ML import aliases (e.g. functional as F)
    "T201",     # CLI / dataset-prep / report tooling: stdout is the interface
]

[tool.ruff.lint.per-file-ignores]
"src/tajik_omnilingual_asr/eval/test_split.py" = [
    "RUF002",  # Cyrillic letters resembling Latin are intentional Tajik text.
]
# Channel names/notes are intentional Tajik (Cyrillic) text.
"src/tajik_omnilingual_asr/sources.py" = ["RUF001", "RUF002", "RUF003"]
# SQL is built only from static fragments and `?` placeholder lists derived from
# list lengths; all user-supplied values are passed as bound parameters, not
# interpolated. No external input reaches the query text.
"src/tajik_omnilingual_asr/dataset_prep/curation/scribe.py" = ["S608"]
