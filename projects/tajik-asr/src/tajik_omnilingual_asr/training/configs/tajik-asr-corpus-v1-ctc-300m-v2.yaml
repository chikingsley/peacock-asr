model:
  name: "omni_ctc_300m_v2_base"

# v1 = v0's real Tajik corpora + a transliterated-Persian FLEURS augmentation corpus
# (corpus=persian_translit_fleurs). Aggressive mix: the full FLEURS Persian slice that
# passes the 0.55 Tajik-vocab coverage filter, sampled as a peer corpus (beta_corpus=0.5
# tempers it against the real Tajik). A/B vs v0: identical hyperparameters; the only
# changes are the dataset card + mixture summary. GATE on the real Tajik test split.
dataset:
  name: "tajik_asr_corpus_v1"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "/home/simon/github/peacock-asr/projects/tajik-asr/src/tajik_omnilingual_asr/dataset_prep/artifacts/tajik_asr_combined_v1/omni_parquet/language_distribution_0.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: true
  asr_task_config:
     min_audio_len: 16_000
     max_audio_len: 960_000
     max_num_elements: 2_000_000
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 1

tokenizer:
  name: "omni_asr_tokenizer_written_v2_local"

optimizer:
  config:
    lr: 1e-05

trainer:
  freeze_encoder_for_n_steps: 0
  mixed_precision:
    dtype: "torch.bfloat16"
  grad_accumulation:
    num_batches: 2
  activation_checkpointing:
    mode: "layerwise"
    every_nth_layer: 1
  gc_every_n_steps: 100

regime:
  # Mirror v0 exactly for a clean A/B. num_steps is a ceiling; we ship the best-WER
  # checkpoint (score_metric=wer, lower=better), not the last — the small-data overfit
  # guard. The larger v1 mix means each epoch is more steps, so 4000 covers fewer epochs
  # than v0 did; that's fine (more data -> less per-epoch overfit).
  num_steps: 4_000
  score_metric: "wer"
  validate_every_n_steps: 200
  validate_after_n_steps: 199
  checkpoint_every_n_steps: 200
  checkpoint_after_n_steps: 199
  keep_best_n_checkpoints: 3
  keep_last_n_checkpoints: 1
  save_model_only: "all_but_last"
  publish_metrics_every_n_steps: 1
  publish_metrics_after_n_steps: 0
