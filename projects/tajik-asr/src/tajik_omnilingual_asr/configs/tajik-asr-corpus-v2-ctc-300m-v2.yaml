model:
  name: "omni_ctc_300m_v2_base"

dataset:
  name: "tajik_asr_corpus_v2"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    # Hand-WEIGHTED copy of language_distribution_0.tsv: fleurs listed at 490 effective hours
    # (true: 11.8) so clean read speech — the benchmark domain — is ~12% of sampled batches
    # instead of 2%. Run 1 (true hours, lr 1e-5) drifted: dev WER rose 20.35 -> 21.68 over
    # 4k steps while UER improved — pure domain migration toward 99%-YouTube.
    dataset_summary_path: "/home/simon/github/peacock-asr/projects/tajik-asr/data/datasets/v2/language_distribution_weighted.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: true
      # On real disk, NOT the default tempfile.mkdtemp() -> /tmp: /tmp is a 47G tmpfs and the
      # mmap'd audio fragments overflowed it at step ~15k (pyarrow EDQUOT, run killed).
      cache_dir: "/home/simon/github/peacock-asr/projects/tajik-asr/data/cache/fragments"
  asr_task_config:
     min_audio_len: 16_000
     max_audio_len: 960_000
     max_num_elements: 2_000_000
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 1

tokenizer:
  name: "omni_asr_tokenizer_written_v2_local"

optimizer:
  config:
    # 1e-5 (the 5.8h-v0 setting) migrated the model to the dominant domain within 2k steps on
    # this corpus. 5e-6 + explicit tri-stage (the shape of Persian's winning rewarm) adapts
    # the acoustics without abandoning the base model's read-speech competence.
    lr: 5e-06

lr_scheduler:
  name: "tri_stage"
  config:
    stage_ratio: [0.1, 0.4, 0.5]
    start_lr_scale: 0.01
    final_lr_scale: 0.05

trainer:
  freeze_encoder_for_n_steps: 0
  mixed_precision:
    dtype: "torch.bfloat16"
  grad_accumulation:
    num_batches: 2
  activation_checkpointing:
    mode: "layerwise"
    every_nth_layer: 1
  gc_every_n_steps: 100

regime:
  # v2 is ~1,400 h (vs v0's 5.8 h), so 20k steps is roughly ONE epoch at this batch size —
  # no overfit pressure; the budget is wall-clock. Validate every 500 steps on FLEURS dev and
  # keep the best-WER checkpoints (ship the best, not the last).
  num_steps: 20_000
  score_metric: "wer"
  validate_every_n_steps: 500
  validate_after_n_steps: 499
  checkpoint_every_n_steps: 500
  checkpoint_after_n_steps: 499
  keep_best_n_checkpoints: 3
  keep_last_n_checkpoints: 1
  save_model_only: "all_but_last"
  publish_metrics_every_n_steps: 1
  publish_metrics_after_n_steps: 0
