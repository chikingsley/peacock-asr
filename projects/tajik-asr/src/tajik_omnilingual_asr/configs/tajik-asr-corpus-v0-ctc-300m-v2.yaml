model:
  name: "omni_ctc_300m_v2_base"

dataset:
  name: "tajik_asr_corpus"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "/home/simon/github/peacock-asr/projects/tajik-asr/src/tajik_omnilingual_asr/dataset_prep/artifacts/tajik_asr_combined_v0/omni_parquet/language_distribution_0.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: true
  asr_task_config:
     min_audio_len: 16_000
     max_audio_len: 960_000
     max_num_elements: 2_000_000
     batch_shuffle_window: 1
     normalize_audio: true
     example_shuffle_window: 1

tokenizer:
  name: "omni_asr_tokenizer_written_v2_local"

optimizer:
  config:
    lr: 1e-05

trainer:
  freeze_encoder_for_n_steps: 0
  mixed_precision:
    dtype: "torch.bfloat16"
  grad_accumulation:
    num_batches: 2
  activation_checkpointing:
    mode: "layerwise"
    every_nth_layer: 1
  gc_every_n_steps: 100

regime:
  # ~32 epochs cap on 5.8h (≈123 steps/epoch at max_num_elements 2.0M). Validate every
  # 200 steps and keep the best-WER checkpoints (score_metric=wer, lower is better) — we
  # ship the best, not the last (the documented small-data overfit guard).
  num_steps: 4_000
  score_metric: "wer"
  validate_every_n_steps: 200
  validate_after_n_steps: 199
  checkpoint_every_n_steps: 200
  checkpoint_after_n_steps: 199
  keep_best_n_checkpoints: 3
  keep_last_n_checkpoints: 1
  save_model_only: "all_but_last"
  publish_metrics_every_n_steps: 1
  publish_metrics_after_n_steps: 0
