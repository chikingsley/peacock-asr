[project]
name = "p011-muffin-improvements"
version = "0.1.0"
description = "Paper-faithful frame-level HConv experiments on top of MuFFIN pronunciation assessment"
requires-python = ">=3.12"
dependencies = [
    # core ML
    "torch>=2.10",
    "torchaudio>=2.10",
    "transformers>=5.3",
    "datasets>=4.8",
    "accelerate>=1.13",
    # data / science
    "numpy>=2.4",
    "scipy>=1.17",
    "scikit-learn>=1.8",
    "pandas>=3.0",
    # experiment tracking
    "wandb>=0.25",
    # config
    "pydantic-settings>=2.13",
    "pydantic>=2.12",
    # utils
    "rich>=14.3",
    "click>=8.3",
    "tqdm>=4.67",
    "huggingface-hub>=1.7",
    # audio
    "soundfile>=0.13",
    "librosa>=0.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "ty>=0.0.24",
    "pytest>=9.0",
    "pytest-cov>=7.1",
]

[project.scripts]
p011 = "p011.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p011"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",   # dynamically typed expressions (Any)
    "B008",     # do not perform function call in argument defaults
    "N806",     # ML convention: B/T/C/N as batch/time/channel/classes in function bodies
    "N812",     # ML convention: `import torch.nn.functional as F`
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "N803", "N806"]  # N803/N806: B/T/C ok as local names in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    # PyTorch 2.10 internal bug in pin_memory.py — fixed upstream but not yet released.
    # Fires once per tensor per batch (~9000 times per smoke test). Suppressed to avoid
    # burying real warnings. Track: https://github.com/pytorch/pytorch/pull/174584
    "ignore:The argument 'device' of Tensor.pin_memory:DeprecationWarning",
    "ignore:The argument 'device' of Tensor.is_pinned:DeprecationWarning",
    # wandb internal sentry warning — not actionable from our code
    "ignore:Read the `app_url` setting:DeprecationWarning",
]
