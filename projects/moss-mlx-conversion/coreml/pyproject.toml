[project]
name = "moss-transcribe-coreml"
version = "0.1.0"
description = "Private CoreML export workbench for MOSS-Transcribe-preview-2B."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "coremltools>=8.1,<10",
    "numpy>=1.26,<3",
    "safetensors>=0.5.3",
    "torch>=2.4.0",
    "transformers>=4.57.1,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "export_swift_fixture.py",
    "export_audio_encoder_adapter.py",
    "export_decoder_prefill.py",
    "export_decoder_stateful.py",
    "export_decoder_step.py",
    "run_stateful_fixture_pipeline.py",
    "export_token_embedding.py",
    "README.md",
]
